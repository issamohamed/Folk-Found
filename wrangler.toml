name = "folk-and-found"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# Cached prose, Commons image results and Wikipedia summaries.
# `id` is only used for remote (deployed) runs; `wrangler pages dev` keeps a
# local KV on disk and ignores it. Replace it with the real namespace id from
#   npx wrangler kv namespace create FOLKLORE_CACHE
# before deploying.
[[kv_namespaces]]
binding = "FOLKLORE_CACHE"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"
